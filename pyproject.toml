[project]
name = "ml-reliability-observability"
version = "0.1.0"
description = "FIAP MLET Fase 4"
authors = [{name = "Cauã Graff"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "pandera>=0.24,<1",
  "joblib>=1.4,<2",
]
[tool.poetry]
package-mode = false

[project.optional-dependencies]
drift = ["evidently>=0.7,<0.8"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
