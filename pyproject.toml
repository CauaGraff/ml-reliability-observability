[project]
name = "ml-reliability-observability"
version = "0.2.0"
description = "FIAP MLET - Fase 4: validacao, data drift, observabilidade e governanca"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Equipe FIAP" }]
readme = "README.md"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "pandera>=0.24,<1",
    "joblib>=1.4,<2",
    "scipy>=1.13,<2",
    "evidently>=0.7,<0.8",
    "mlflow>=3,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "data", "models", "reports", "monitoring/mlruns"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
